name: Test Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  fast-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .
      - name: Determinism/flaky pattern guard
        run: |
          python scripts/ci/check_flaky_patterns.py
          python scripts/ci/check_regression_tests.py
          python scripts/ci/audit_cli_script_boundaries.py
      - name: Run unit tests with coverage
        run: |
          pytest -m "unit and not slow" tests/unit --cov=node --cov=shared --cov-report=xml --cov-report=json
      - name: Coverage quality gates
        run: python scripts/ci/check_module_coverage.py --coverage-json coverage.json --min-total 55
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: fast-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .
      - name: Run integration + e2e
        run: |
          pytest -m "integration or e2e" tests/integration tests/e2e

  security-adversarial:
    runs-on: ubuntu-latest
    needs: fast-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e .
      - name: Run security + fuzz suites
        env:
          BERZ_FUZZ_SEED: "20260405"
          BERZ_MEMPOOL_FUZZ_SEED: "20260408"
          BERZ_FUZZ_SAMPLES: "1200"
          BERZ_MEMPOOL_FUZZ_SAMPLES: "800"
        run: |
          pytest tests/integration/test_security_regressions.py tests/fuzz
