[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "berzcoin"
version = "0.1.0"
description = "BerzCoin node and libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "cryptography>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "psutil>=5.8.0",
]
packaging = [
    "pyinstaller>=6.0",
]

[project.scripts]
berzcoin = "cli.launcher:main"
berzcoind = "node.app.main:main"
berzcoin-cli = "cli.main:main"
berzcoin-wallet = "cli.wallet_standalone:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["node*", "shared*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py", "send_receive.py"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=node --cov=shared --cov-report=term-missing --cov-report=xml --cov-fail-under=55"
markers = [
    "unit: fast deterministic unit tests",
    "integration: multi-component integration tests",
    "e2e: end-to-end scenario tests",
    "fuzz: adversarial fuzz tests",
    "chaos: long-running chaos/fault tests",
    "slow: long-running or timing-sensitive tests",
    "regression: regression test for a previously fixed bug",
    "allow_sleep: explicitly allow real blocking sleep usage",
]
